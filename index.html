<title>Steel Squall</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #05070f;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  #app { width: 100%; height: 100%; }
  canvas { display: block; touch-action: none; image-rendering: pixelated; }

  /* CRT scanlines over the whole screen. Pure CSS so it stays crisp at any scale.
     Toggled from the title screen (body.no-crt). */
  #crt {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background:
      repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,.22) 3px, rgba(0,0,0,0) 4px),
      radial-gradient(ellipse at center, rgba(0,0,0,0) 60%, rgba(0,0,0,.45) 100%);
  }
  body.no-crt #crt { display: none; }

  /* The game is landscape-only. */
  #rotate {
    position: fixed; inset: 0; z-index: 20; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: #05070f; color: #4ad4ff;
    font: bold 16px ui-monospace, Menlo, Consolas, monospace; letter-spacing: 3px; text-align: center;
  }
  #rotate .phone {
    width: 40px; height: 70px; border: 4px solid #4ad4ff; border-radius: 6px;
    animation: turn 1.6s infinite ease-in-out;
  }
  @keyframes turn { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  @media (orientation: portrait) and (max-width: 900px) { #rotate { display: flex; } }

  #boot {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: #05070f; color: #4ad4ff;
    font: bold 14px ui-monospace, Menlo, Consolas, monospace; letter-spacing: 3px;
    transition: opacity .25s ease; z-index: 10;
  }
  #boot.done { opacity: 0; pointer-events: none; }
</style>
  <script type="module" crossorigin src="./assets/index-Dnoq8eUn.js"></script>
</head>
<body>
  <div id="app"></div>
  <div id="crt"></div>
  <div id="rotate"><div class="phone"></div><div>ROTATE DEVICE</div></div>
  <div id="boot"><div>STEEL SQUALL</div><div>LOADING</div></div>
</body>
